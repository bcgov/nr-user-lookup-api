name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-24.04
    steps:
      # Get PR number for squash merges to main
      - id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1
  deploy-test:
    name: TEST Deploys (${{ needs.init.outputs.pr }})
    needs: [init]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      bceid_web_service_osid: ${{ secrets.bceid_web_service_osid }}
      bceid_web_service_requester_user_guid: ${{ secrets.bceid_web_service_requester_user_guid }}
      bceid_web_service_username: ${{ secrets.bceid_web_service_username }}
      bceid_web_service_password: ${{ secrets.bceid_web_service_password }}
      keycloak_sa_client_id: ${{ secrets.keycloak_sa_client_id }}
      keycloak_sa_client_secret: ${{ secrets.keycloak_sa_client_secret }}
    with:
      environment: test
      target: test
      tag: ${{ needs.init.outputs.pr }}

  tests:
    name: Tests
    needs: [deploy-test]
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: test

  deploy-prod:
    name: PROD Deploys (${{ needs.init.outputs.pr }})
    needs: [tests, init]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      bceid_web_service_osid: ${{ secrets.bceid_web_service_osid }}
      bceid_web_service_requester_user_guid: ${{ secrets.bceid_web_service_requester_user_guid }}
      bceid_web_service_username: ${{ secrets.bceid_web_service_username }}
      bceid_web_service_password: ${{ secrets.bceid_web_service_password }}
      keycloak_sa_client_id: ${{ secrets.keycloak_sa_client_id }}
      keycloak_sa_client_secret: ${{ secrets.keycloak_sa_client_secret }}
    with:
      environment: prod
      target: prod
      tag: ${{ needs.init.outputs.pr }}

  # Sync Sysdig email alerts for PROD. No-ops cleanly if SYSDIG_API_TOKEN is
  # unset or monitoring/alerts/ is empty — adoption is gradual. Alert
  # templates live in monitoring/alerts/ in this repo; add or remove files
  # there to customize the alert set.
  #
  # This repo is backend-only and deploys a single Deployment named
  # <app>-<zone> (nr-user-lookup-api-prod) — there is no component segment in
  # the name. So `components` is pinned to one entry (the action defaults to
  # `frontend,backend`, which would create a phantom frontend alert set), and
  # the queries in monitoring/alerts/*.json target __APP__-prod directly
  # rather than the action's usual __APP__-__COMPONENT__-prod. The value below
  # only shapes the alert names (<app>-backend-<rule>); don't reintroduce
  # __COMPONENT__ into the queries.
  monitor-prod:
    name: Sysdig Monitor (PROD)
    needs: [deploy-prod]
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: bcgov/actions/sysdig-monitor@4ad61a784f1c17765b03d8d6de9737c1d3f4c0f2 # v0.5.0
        with:
          sysdig_api_token: ${{ secrets.SYSDIG_API_TOKEN }}
          oc_namespace: ${{ secrets.oc_namespace }}
          app: ${{ github.event.repository.name }}
          components: backend

  promote:
    name: Promote Images
    needs: [deploy-prod, init]
    runs-on: ubuntu-slim
    permissions:
      packages: write
    strategy:
      matrix:
        package: [api]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.init.outputs.pr }}
          tags: prod
